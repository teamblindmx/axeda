name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Architecture rules
        run: npm run deps:check
      - name: Tests
        run: npm run test

  postgres:
    name: PostgreSQL ${{ matrix.postgres }} (real server)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Las pruebas crean y borran una base de datos por prueba en este servidor.
      AXEDA_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests against a real PostgreSQL server with a connection pool
        run: npx vitest run packages/better-auth
      - name: Benchmark against the same server (fails over budget)
        run: npm run bench -- --check --json bench-results.json
      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-postgres-${{ matrix.postgres }}
          path: bench-results.json
          if-no-files-found: ignore

  package:
    name: Packages (build, contents, install in an empty project)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: What would be published, and nothing else
        run: npm run pack:check
      - name: Install the packed packages in an empty project, run and type-check them
        run: npm run smoke
      - name: Inventory of third-party components (CycloneDX)
        run: npm run sbom -- --out sbom
      - name: Keep the inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom/

  better-auth:
    name: Better Auth ${{ matrix.version }}${{ matrix.experimental && ' (informational)' || '' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The lowest version the peer range allows (what the lockfile pins).
          - version: 1.7.10
            experimental: false
          # The latest stable release when this was written.
          - version: 1.7.14
            experimental: false
          # The next minor, still in beta: a heads-up, never a blocker.
          - version: 1.8.0-beta.3
            experimental: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use Better Auth ${{ matrix.version }}
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund better-auth@${{ matrix.version }}
          npm install --no-save --ignore-scripts --no-audit --no-fund better-auth@${{ matrix.version }} @better-auth/core@${{ matrix.version }} -w @axeda/better-auth
      - name: Types and every test
        if: ${{ !matrix.experimental }}
        run: |
          npm run typecheck
          npx vitest run
      - name: The plugin's own tests
        if: ${{ matrix.experimental }}
        run: npx vitest run packages/better-auth

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
