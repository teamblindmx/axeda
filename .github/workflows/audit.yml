name: Dependency audit

# Un aviso de seguridad nuevo puede romper el CI de un día para otro sin que nadie toque el código
# (pasó con body-parser). Esta revisión semanal lo detecta antes de que bloquee un PR.
on:
  schedule:
    - cron: '23 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Advisories and signatures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Known vulnerabilities
        run: npm audit --audit-level=high
      - name: Registry signatures and provenance of every installed package
        run: npm audit signatures
